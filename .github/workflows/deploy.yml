name: Publish Kerala2040 research record
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout frozen website release
        uses: actions/checkout@v4
        with:
          path: release-pointer
          persist-credentials: false
      - name: Resolve immutable research data reference
        id: source
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          pointer = Path("release-pointer/SOURCE_COMMIT").read_text(encoding="utf-8")
          m = re.search(r"^Research source: abhijith-sivaprasadan/kerala2040@([a-f0-9]{40})$", pointer, re.MULTILINE)
          if not m:
              raise SystemExit("SOURCE_COMMIT must identify a single pinned research commit")
          print(f"sha={m.group(1)}")
          PY
      - name: Checkout pinned research dataset
        uses: actions/checkout@v4
        with:
          repository: abhijith-sivaprasadan/kerala2040
          ref: ${{ steps.source.outputs.sha }}
          path: research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pinned source data and model packaging contracts
        run: |
          python -m pip install 'pyyaml>=6,<7' 'cairosvg>=2.7,<3'
          node --check research/docs/assets/app.js
          node --test research/tests/web.test.cjs
          PYTHONPATH=research/src python research/scripts/build_site.py --check
          python release-pointer/scripts/verify_research_mirrors.py --research-dir research --website-dir release-pointer
      - name: Assemble only admitted scientific publication files
        shell: bash
        run: |
          set -euo pipefail
          root="release-site"
          mkdir -p "$root/assets" "$root/data"
          for page in index research paper system methodology findings responses qa sources atlas; do
            cp "release-pointer/${page}.html" "$root/${page}.html"
          done
          cp release-pointer/assets/companion.css "$root/assets/companion.css"
          cp release-pointer/assets/mark.svg "$root/assets/mark.svg"
          cp release-pointer/assets/kerala-icons.svg "$root/assets/kerala-icons.svg"
          cp release-pointer/assets/kerala-horizon.svg "$root/assets/kerala-horizon.svg"
          cp release-pointer/assets/evidence-motion.css "$root/assets/evidence-motion.css"
          cp release-pointer/assets/evidence-atlas.js "$root/assets/evidence-atlas.js"
          cp release-pointer/data/kseb-history.json "$root/data/kseb-history.json"
          cp release-pointer/SOURCE_COMMIT "$root/SOURCE_COMMIT"
          cp release-pointer/SOURCE_PROVENANCE.md "$root/SOURCE_PROVENANCE.md"
          cp release-pointer/data/daily-demand-ml-robustness-v0.2.json "$root/data/daily-demand-ml-robustness-v0.2.json"
          cp release-pointer/data/research-installed-generation.json "$root/data/research-installed-generation.json"

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("release-site")
          records = sorted(p for p in root.rglob("*") if p.is_file())
          source_pin = (root / "SOURCE_COMMIT").read_text(encoding="utf-8").strip()
          manifest = {
              "edition": "2026-10-23-scientific-evidence-freeze",
              "release_type": "descriptive historical evidence and retrospective observed-daily modelling",
              "research_source": source_pin,
              "source_data_definition": "KSEBL annual consumer-side and SLDC operational daily values kept separate",
              "physical_hourly_validation": False,
              "featured_scenario_results": False,
              "public_file_sha256": {
                  p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in records
              },
          }
          (root / "RELEASE_MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY
          node --check release-site/assets/evidence-atlas.js
          python release-pointer/.github/scripts/check_frozen_release.py --root release-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
