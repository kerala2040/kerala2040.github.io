name: Publish pinned CET research companion
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website release pointer
        uses: actions/checkout@v4
        with:
          path: release-pointer
          persist-credentials: false
      - name: Resolve immutable research source
        id: source
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          pointer = Path("release-pointer/SOURCE_COMMIT").read_text(encoding="utf-8")
          match = re.search(r"^Research source: abhijith-sivaprasadan/kerala2040@([a-f0-9]{40})$", pointer, re.MULTILINE)
          if match is None:
              raise SystemExit("SOURCE_COMMIT must name an immutable 40-character research commit")
          print(f"sha={match.group(1)}")
          PY
      - name: Checkout pinned research release
        uses: actions/checkout@v4
        with:
          repository: abhijith-sivaprasadan/kerala2040
          ref: ${{ steps.source.outputs.sha }}
          path: research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website audit build dependency
        run: python -m pip install 'pyyaml>=6,<7' 'cairosvg>=2.7,<3'
      - name: Validate and build pinned release
        working-directory: research
        env:
          PYTHONPATH: src
        run: |
          node --check docs/assets/app.js
          node --test tests/web.test.cjs
          python scripts/build_site.py --check
          python scripts/build_site.py --output _site
      - name: Overlay CET 2026 conference companion
        shell: bash
        run: |
          set -euo pipefail
          root="research/_site"
          mkdir -p "$root/assets"
          for page in index research paper system methodology findings responses qa sources; do
            cp "release-pointer/${page}.html" "$root/${page}.html"
          done
          cp "release-pointer/assets/companion.css" "$root/assets/companion.css"
          cp "release-pointer/assets/mark.svg" "$root/assets/mark.svg"
          mkdir -p "$root/forme"
          cp "release-pointer/forme/index.html" "$root/forme/index.html"
          cp "release-pointer/SOURCE_PROVENANCE.md" "$root/SOURCE_PROVENANCE.md"
          mkdir -p "$root/data"
          cp "release-pointer/data/daily-demand-ml-robustness-v0.2.json" "$root/data/daily-demand-ml-robustness-v0.2.json"
          python - <<'PY'
          from pathlib import Path

          root = Path("research/_site")
          required = [
              "index.html",
              "research.html",
              "paper.html",
              "system.html",
              "methodology.html",
              "findings.html",
              "responses.html",
              "qa.html",
              "sources.html",
              "assets/companion.css",
              "assets/mark.svg",
              "forme/index.html",
              "data/daily-demand-ml-robustness-v0.2.json",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"Missing companion outputs: {missing}")
          index = (root / "index.html").read_text(encoding="utf-8")
          if "Energy Data & Modelling" in index:
              raise SystemExit("Old broad dashboard framing leaked back into public index")
          if "Why is Kerala susceptible" not in index:
              raise SystemExit("Diagnosis-first research question missing from public index")
          if "New result · 6 October 2026" not in index:
              raise SystemExit("6 October daily-demand ML robustness result missing from public index")
          PY
      - name: Record release and evidence identities
        env:
          RESEARCH_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          pointer = Path("release-pointer/SOURCE_COMMIT").read_text(encoding="utf-8")
          root = Path("research/_site")
          site_data = root / "data/site-data.json"
          metadata = json.loads((root / "data/metadata.json").read_text(encoding="utf-8"))
          source_sha = os.environ["RESEARCH_SHA"]
          if source_sha not in pointer:
              raise SystemExit("Research source SHA differs from release pointer")
          if metadata.get("generated_at_utc") is None:
              raise SystemExit("Missing evidence snapshot timestamp")
          release = {
              "release_scope": "CET 2026 diagnosis-first research companion / observed evidence, screening models and scientific QA",
              "website_edition": metadata["website_edition"],
              "research_source_commit": source_sha,
              "evidence_snapshot_generated_at_utc": metadata["generated_at_utc"],
              "evidence_source_git_sha": metadata.get("git_sha"),
              "published_site_data_sha256": hashlib.sha256(site_data.read_bytes()).hexdigest(),
              "publication_policy": metadata["publication_policy"],
              "published_model_records": metadata["published_model_records"],
              "published_source_audits": metadata["published_source_audits"],
          }
          (root / "SOURCE_COMMIT").write_text(pointer, encoding="utf-8")
          (root / "RELEASE_MANIFEST.json").write_text(json.dumps(release, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(release, indent=2))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: research/_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
