name: CI

on:
  schedule:
    - cron: "52 3 * * 3"
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check dashboard JavaScript
        run: node --check assets/app.js
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate dashboard data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('data').rglob('*.json')) + [Path('manifest.webmanifest')]
          assert Path('index.html').is_file()
          assert files
          for p in files:
              json.loads(p.read_text(encoding='utf-8-sig'))
          print(f'Validated {len(files)} data/manifest files')
          PY
      - name: Check HTML and local links/assets
        run: |
          python .github/scripts/check_site.py
          python .github/scripts/check_editorial.py
      - name: Resolve research evidence pin
        id: research-pin
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          pointer = Path("SOURCE_COMMIT").read_text(encoding="utf-8")
          match = re.search(r"^Research source: abhijith-sivaprasadan/kerala2040@([0-9a-f]{40})$", pointer, re.MULTILINE)
          if not match:
              raise SystemExit("Missing or malformed research-source pin")
          print(f"sha={match.group(1)}")
          PY
      - name: Checkout pinned research evidence
        uses: actions/checkout@v4
        with:
          repository: abhijith-sivaprasadan/kerala2040
          ref: ${{ steps.research-pin.outputs.sha }}
          path: research
          persist-credentials: false
      - name: Verify published research data mirrors
        run: python scripts/verify_research_mirrors.py --research-dir research --website-dir .
      - name: Install pinned build dependencies
        run: python -m pip install 'pyyaml>=6,<7' 'cairosvg>=2.7,<3'
      - name: Validate pinned research site build
        env:
          PYTHONPATH: research/src
        run: |
          node --check research/docs/assets/app.js
          node --test research/tests/web.test.cjs
          python research/scripts/build_site.py --check


